<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palpites Bolão</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon-32x32.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

       <div class="logo-lotofacil">
            <div class="logo-titulo">
                <span class="loto">LOTO</span><span class="facil">FÁCIL</span>
            </div>

            <div class="logo-da">da</div>

            <div class="faixa-independencia">
                INDEPENDÊNCIA
            </div>
        </div>
        <div class="painel">

            <div class="campo">
                <label>Nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome">
            </div>

            <div class="campo">
                <!-- <label>E-mail</label>
                <input type="text" id="email" placeholder="Digite seu e-mail"> -->
            </div>

            <!-- <div class="botoes">
                <button onclick="limparJogo()">
                    LIMPAR JOGO
                </button>

                <button onclick="salvarJogo()">
                    SALVAR JOGO
                </button>

                <a href="/login">
                    <button type="button">
                        VER BANCO
                    </button>
                </a>
            </div> -->

        <!-- </div> -->


        <div class="prazo-jogos">
            🟢 Aceitando jogos até {{ data_limite }}
        </div>

        <h2 id="mensagem"></h2>

        <div id="controle-quantidade" class="controle-quantidade" style="display: none;">
            <label for="quantidade-jogo">Quantos números deseja na tabela?</label>
            <select id="quantidade-jogo" name="quantidade-jogo"></select>
        </div>

        <div id="tabela" class="tabela"></div>

        <div class="botoes">
                <button id="cinza1" onclick="limparJogo()">
                    LIMPAR JOGO
                </button>

                <button id="gerar-aleatorio" type="button" onclick="gerarAleatorio()">
                    GERAR JOGO ALEATÓRIO
                </button>

                <button onclick="salvarJogo()">
                    SALVAR JOGO
                </button>

                <a href="/login">
                    <button id="cinza2" type="button">
                        ADM
                    </button>
                </a>
            </div>

        </div>

    </div>

   <script>
       window.CONFIGURACAO_JOGO = {{ configuracao | default({}) | tojson }};
   </script>
   <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
