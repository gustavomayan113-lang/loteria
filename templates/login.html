<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área Restrita - Loteria do Nior</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style-admin.css') }}"
    >

</head>

<body>

    <div class="login-container">

        <h1>ÁREA RESTRITA</h1>

        <p class="subtitulo">
            somente administrador
        </p>

        {% if erro %}

            <p class="erro">
                {{ erro }}
            </p>

        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="login"
                placeholder="Login"
                required
            >

            <input
                type="password"
                name="senha"
                placeholder="Senha"
                required
            >

            <button type="submit">
                ENTRAR
            </button>

        </form>

        <a href="/" class="voltar">
            Voltar
        </a>

    </div>

</body>

</html>
